{% extends "base.html" %}
{% block title %}Detalle Alojamiento{% endblock %}
{% block content %}
<h2 class="mb-4">Detalle de Alojamiento</h2>
<ul class="list-group">
    <li class="list-group-item"><strong>Nombre:</strong> {{ alojamiento.nombre }}</li>
    <li class="list-group-item"><strong>Capacidad Total:</strong> {{ alojamiento.capacidad_total }}</li>
</ul>
<a href="{% url 'alojamientos:editar' alojamiento.id %}" class="btn btn-warning mt-3">Editar</a>
<a href="{% url 'alojamientos:index' %}" class="btn btn-secondary mt-3">Volver</a>
{% endblock %}
