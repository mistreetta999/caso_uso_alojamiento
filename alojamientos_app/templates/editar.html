{% extends "base.html" %}
{% block title %}Editar Alojamiento{% endblock %}
{% block content %}
<h2 class="mb-4">Editar Alojamiento</h2>
<form method="post">
    {% csrf_token %}
    <div class="mb-3">
        <label for="nombre" class="form-label">Nombre</label>
        <input type="text" class="form-control" id="nombre" name="nombre" value="{{ alojamiento.nombre }}" required>
    </div>
    <div class="mb-3">
        <label for="capacidad_total" class="form-label">Capacidad Total</label>
        <input type="number" class="form-control" id="capacidad_total" name="capacidad_total" value="{{ alojamiento.capacidad_total }}" required>
    </div>
    <button type="submit" class="btn btn-success">Actualizar</button>
    <a href="{% url 'alojamientos:index' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
