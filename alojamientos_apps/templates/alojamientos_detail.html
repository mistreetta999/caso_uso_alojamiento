{% extends "base.html" %}
{% block content %}
<h1>{{ alojamiento.nombre }}</h1>
<p><strong>Ubicación:</strong> {{ alojamiento.ubicacion }}</p>
<p><strong>Capacidad:</strong> {{ alojamiento.capacidad }}</p>
<p><strong>Precio:</strong> {{ alojamiento.precio }}</p>
<p><strong>Disponible:</strong> {{ alojamiento.disponible }}</p>
<a href="{% url 'alojamientos_update' alojamiento.id %}">Editar</a>
<a href="{% url 'alojamientos_delete' alojamiento.id %}">Eliminar</a>
{% endblock %}
