{% extends "base.html" %}
{% block title %}Editar Cabaña{% endblock %}
{% block content %}
<h2 class="mb-4">Editar Cabaña</h2>
<form method="post">
    {% csrf_token %}
    <div class="mb-3">
        <label for="nombre" class="form-label">Nombre</label>
        <input type="text" class="form-control" id="nombre" name="nombre" value="{{ cabana.nombre }}" required>
    </div>
    <div class="mb-3">
        <label for="capacidad" class="form-label">Capacidad</label>
        <input type="number" class="form-control" id="capacidad" name="capacidad" value="{{ cabana.capacidad }}" required>
    </div>
    <div class="mb-3">
        <label for="precio" class="form-label">Precio por noche</label>
        <input type="number" class="form-control" id="precio" name="precio" value="{{ cabana.precio }}" required>
    </div>
    <button type="submit" class="btn btn-success">Actualizar</button>
    <a href="{% url 'cabanas:index' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
