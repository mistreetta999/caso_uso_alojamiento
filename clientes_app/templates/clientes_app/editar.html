{% extends "base.html" %}
{% block title %}Editar Reserva{% endblock %}
{% block content %}
<h2 class="mb-4">Editar Reserva</h2>
<form method="post">
    {% csrf_token %}
    <div class="mb-3">
        <label for="cliente" class="form-label">Cliente</label>
        <select class="form-select" id="cliente" name="cliente" required>
            {% for cliente in clientes %}
            <option value="{{ cliente.id }}" {% if cliente.id == reserva.cliente.id %}selected{% endif %}>{{ cliente.nombre }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label for="cabana" class="form-label">Cabaña</label>
        <select class="form-select" id="cabana" name="cabana" required>
            {% for cabana in cabanas %}
            <option value="{{ cabana.id }}" {% if cabana.id == reserva.cabana.id %}selected{% endif %}>{{ cabana.nombre }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label for="fecha_inicio" class="form-label">Fecha Inicio</label>
        <input type="date" class="form-control" id="fecha_inicio" name="fecha_inicio" value="{{ reserva.fecha_inicio }}" required>
    </div>
    <div class="mb-3">
        <label for="fecha_fin" class="form-label">Fecha Fin</label>
        <input type="date" class="form-control" id="fecha_fin" name="fecha_fin" value="{{ reserva.fecha_fin }}" required>
    </div>
    <button type="submit" class="btn btn-success">Actualizar</button>
    <a href="{% url 'reservas:index' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
