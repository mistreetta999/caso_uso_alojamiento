<!DOCTYPE html>
    <html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Aceptación de Alojamiento - Sistema de Alojamiento</title>
        <!-- Carga de Bootstrap 5 para mantener el diseño global -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body class="bg-light">
    <div class="container mt-5 mb-5">
        <!-- Cabecera de la sección -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>📋 Formulario de Aceptación de Alojamiento</h1>
            <div>
                <a href="/alojamientos/" class="btn btn-outline-success me-2">← Volver al Listado</a>
                <a href="/" class="btn btn-outline-secondary">Ir al Inicio</a>
            </div>
        </div>
    
        <!-- Tarjeta contenedora del formulario -->
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm border-success">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0">Registro y Control de Ingreso</h5>
                    </div>
                    <div class="card-body">
                        <!-- Formulario de Django -->
                        <form method="post">
                            {% csrf_token %>
                            
                            <div class="mb-3">
                                <label for="cliente" class="form-label fw-bold">Nombre del Cliente:</label>
                                <input type="text" id="cliente" name="cliente" class="form-control" placeholder="Ingrese el nombre completo" required>
                            </div>
    
                            <div class="mb-3">
                                <label for="dni" class="form-label fw-bold">DNI:</label>
                                <input type="text" id="dni" name="dni" class="form-control" placeholder="Número de documento" required>
                            </div>
    
                            <div class="mb-3">
                                <label for="cabana" class="form-label fw-bold">Número de Cabaña:</label>
                                <input type="number" id="cabana" name="cabana" class="form-control" placeholder="Ej. 3" required>
                            </div>
    
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="fecha_ingreso" class="form-label fw-bold">Fecha de Entrada:</label>
                                    <input type="date" id="fecha_ingreso" name="fecha_ingreso" class="form-control" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="hora_ingreso" class="form-label fw-bold">Hora de Entrada:</label>
                                    <input type="time" id="hora_ingreso" name="hora_ingreso" class="form-control" required>
                                </div>
                            </div>
    
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="fecha_salida" class="form-label fw-bold">Fecha de Salida:</label>
                                    <input type="date" id="fecha_salida" name="fecha_salida" class="form-control" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="hora_salida" class="form-label fw-bold">Hora de Salida:</label>
                                    <input type="time" id="hora_salida" name="hora_salida" class="form-control" required>
                                </div>
                            </div>
    
                            <!-- Botones de acción -->
                            <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                                <a href="/alojamientos/" class="btn btn-secondary me-md-2">Cancelar</a>
                                <button type="submit" class="btn btn-success fw-bold">Aceptar y Registrar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Script de Bootstrap y carga opcional de JS personalizado -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% load static %}
    <script src="{% static 'js/main.js' %}"></script>
    </body>
    </html>
