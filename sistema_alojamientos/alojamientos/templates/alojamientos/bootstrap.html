<!DOCTYPE html>
    <html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{% block title %}Bootstrap - Sistema de Alojamiento{% endblock %}</title>
        <!-- Bootstrap 5 CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        {% block extra_head %}{% endblock %}
    </head>
    <body class="bg-light">
    
        <!-- Contenido principal -->
        <main class="container my-5">
            {% block content %}
            <div class="row justify-content-center">
                <div class="col-md-8 text-center">
                    <h1>Configuración de Bootstrap</h1>
                    <p class="lead text-muted">Este archivo centraliza los recursos visuales de Bootstrap para el módulo de alojamientos.</p>
                    <a href="/alojamientos/" class="btn btn-success mt-3">Ir al Listado de Alojamientos</a>
                </div>
            </div>
            {% endblock %}
        </main>
    
        <!-- Bootstrap 5 JS Bundle -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        {% load static %}
        <script src="{% static 'js/main.js' %}"></script>
        {% block extra_js %}{% endblock %}
    </body>
    </html>
