<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Cabaña</title>
</head>
<body>
    <h1>Formulario de Registro de Cabaña</h1>
    <form method="post">
        {% csrf_token %}
        
        <label for="numero">Número de Cabaña:</label>
        <input type="number" id="numero" name="numero" required><br><br>

        <label for="tipo">Tipo:</label>
        <input type="text" id="tipo" name="tipo" required><br><br>

        <label for="capacidad">Capacidad:</label>
        <input type="number" id="capacidad" name="capacidad" required><br><br>

        <label for="informacion">Información adicional:</label>
        <textarea id="informacion" name="informacion"></textarea><br><br>

        <button type="submit">Registrar</button>
    </form>
</body>
</html>
