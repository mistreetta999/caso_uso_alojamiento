<!DOCTYPE html>
    <html>
    <head>
        <title>Lista de Clientes</title>
    </head>
    <body>
        <h1>Listado de Clientes</h1>
        <ul>
            {% for cliente in clientes %}
                <li>{{ cliente.nombre }}</li>
            {% empty %}
                <li>No hay clientes registrados.</li>
            {% endfor %}
        </ul>
    </body>
    </html>
