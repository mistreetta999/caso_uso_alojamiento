<!DOCTYPE html>
    <html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Crear Reserva - Sistema de Alojamiento</title>
        <!-- Carga de Bootstrap 5 -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body class="bg-light">
    <div class="container mt-5 mb-5">
        <!-- Cabecera de la sección -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>📅 Crear Nueva Reserva</h1>
            <div>
                <a href="/reservas/" class="btn btn-outline-success me-2">← Volver al Listado</a>
                <a href="/" class="btn btn-outline-secondary">Ir al Inicio</a>
            </div>
        </div>
    
        <!-- Tarjeta contenedora del formulario -->
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm border-success">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0">Formulario de Registro de Reserva</h5>
                    </div>
                    <div class="card-body">
                        <!-- Formulario de Django -->
                        <form method="post" enctype="multipart/form-data">
                            {% csrf_token %}
                            
                            {{ form.as_p }}
    
                            <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                                <a href="/reservas/" class="btn btn-secondary me-md-2">Cancelar</a>
                                <button type="submit" class="btn btn-success">Guardar Reserva</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
    </html>
