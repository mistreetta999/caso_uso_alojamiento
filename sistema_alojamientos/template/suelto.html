{% extends "base.html" %}

{% block content %}
<h1>Alojamientos disponibles</h1>
<ul>
    {% for alojamiento in object_list %}
        <li>{{ alojamiento.nombre }} - {{ alojamiento.direccion }}</li>
    {% empty %}
        <li>No hay alojamientos registrados.</li>
    {% endfor %}
</ul>
{% endblock %}
