<!-- sistema_alojamientos/templates/base.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Sistema de Alojamientos{% endblock %}</title>
    {% load static %}
    <script src="{% static 'js/main.js' %}"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
        {% load static %}
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
        
    <script src="{% static 'js/main.js' %}"></script>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'index' %}">🏡 Alojamientos</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="{% url 'clientes:index' %}">Clientes</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'reservas:index' %}">Reservas</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'cabanas:index' %}">Cabañas</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'alojamientos:index' %}">Alojamientos</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenido -->
    <main class="container mt-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-light text-center py-3 mt-5">
        <p class="text-muted">&copy; 2026 Sistema Alojamientos</p>
    </footer>
</body>
</html>
