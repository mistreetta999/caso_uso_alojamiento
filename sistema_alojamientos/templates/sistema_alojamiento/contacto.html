<!DOCTYPE html>
    <html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Contacto</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    </head>
    <body class="bg-light">
        <div class="container mt-5">
            <h1 class="text-center text-success">📬 Contacto</h1>
            <p class="text-center">Si necesitás ayuda adicional, podés comunicarte con el equipo de soporte.</p>
    
            <form class="mt-4">
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" class="form-control" id="nombre" placeholder="Tu nombre">
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Correo electrónico</label>
                    <input type="email" class="form-control" id="email" placeholder="tu@email.com">
                </div>
                <div class="mb-3">
                    <label for="mensaje" class="form-label">Mensaje</label>
                    <textarea class="form-control" id="mensaje" rows="4" placeholder="Escribí tu consulta..."></textarea>
                </div>
                <button type="submit" class="btn btn-success">Enviar</button>
            </form>
    
            <footer class="text-center mt-5">
                <p>© 2026 Sistema Unificado | <a href="/" class="text-decoration-none">Volver al Dashboard</a></p>
            </footer>
        </div>
    </body>
    </html>
