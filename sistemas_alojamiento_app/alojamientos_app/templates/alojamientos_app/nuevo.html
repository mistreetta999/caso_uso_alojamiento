<!DOCTYPE html>
    <html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Nuevo Alojamiento - Sistema de Alojamiento</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body class="bg-light">
    <div class="container mt-5">
        <!-- Cabecera de la sección -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>➕ Registrar Nuevo Alojamiento</h1>
            <div>
                <a href="/alojamientos/" class="btn btn-outline-secondary me-2">← Volver al Listado</a>
                <a href="/" class="btn btn-outline-primary">Ir al Inicio</a>
            </div>
        </div>
    
        <!-- Tarjeta contenedora del formulario -->
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm border-danger">
                    <div class="card-header bg-danger text-white">
                        <h5 class="mb-0">Formulario de Registro de Alojamiento</h5>
                    </div>
                    <div class="card-body">
                        <!-- Formulario de Django -->
                        <form method="post" enctype="multipart/form-data">
                            {% csrf_token %}
                            
                            {{ form.as_p }}
    
                            <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                                <a href="/alojamientos/" class="btn btn-secondary me-md-2">Cancelar</a>
                                <button type="submit" class="btn btn-danger">Guardar Alojamiento</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
    </html>
