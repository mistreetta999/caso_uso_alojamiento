<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Cabañas</h2>

        <a
            href="/cabanas/nueva/"
            data-crud-url="/cabanas/nueva/"
            class="btn btn-warning text-white"
        >
            Nueva cabaña
        </a>
    </div>

    <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle">
            <thead class="table-warning">
                <tr>
                    <th>ID</th>
                    <th>Cabaña</th>
                    <th>Acciones</th>
                </tr>
            </thead>

            <tbody>
                {% for cabana in cabanas %}
                <tr>
                    <td>{{ cabana.id }}</td>
                    <td>{{ cabana }}</td>
                    <td>
                        <a
                            href="/cabanas/{{ cabana.id }}/editar/"
                            data-crud-url="/cabanas/{{ cabana.id }}/editar/"
                            class="btn btn-sm btn-primary"
                        >
                            Editar
                        </a>

                        <a
                            href="/cabanas/{{ cabana.id }}/eliminar/"
                            data-crud-url="/cabanas/{{ cabana.id }}/eliminar/"
                            class="btn btn-sm btn-danger"
                        >
                            Eliminar
                        </a>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="3" class="text-center text-muted">
                        No hay cabañas registradas.
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
