<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sistema de alojamientos{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="{% url 'sistema_unificado' %}">Sistema</a>
    <div class="navbar-nav">
      <a class="nav-link" href="{% url 'clientes:inicio' %}">Clientes</a>
      <a class="nav-link" href="{% url 'reservas:inicio' %}">Reservas</a>
      <a class="nav-link" href="{% url 'cabanas:inicio' %}">Cabañas</a>
      <a class="nav-link" href="{% url 'alojamientos:inicio' %}">Alojamientos</a>
    </div>
  </div>
</nav>
<main class="container my-4">
  {% if messages %}
    {% for m in messages %}<div class="alert alert-success">{{ m }}</div>{% endfor %}
  {% endif %}
  {% block contenido %}{% endblock %}
</main>
</body>
</html>
