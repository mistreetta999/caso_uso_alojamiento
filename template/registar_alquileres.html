<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Alquiler</title>
</head>
<body>
    <h1>Formulario de Registro de Alquiler</h1>
    <form method="post">
        
        <label for="cliente">Cliente:</label>
        <input type="text" id="cliente" name="cliente" required><br><br>

        <label for="cabana">Número de Cabaña:</label>
        <input type="number" id="cabana" name="cabana" required><br><br>

        <label for="fecha_ingreso">Fecha de Entrada:</label>
        <input type="date" id="fecha_ingreso" name="fecha_ingreso" required><br><br>

        <label for="hora_ingreso">Hora de Entrada:</label>
        <input type="time" id="hora_ingreso" name="hora_ingreso" required><br><br>

        <label for="fecha_salida">Fecha de Salida:</label>
        <input type="date" id="fecha_salida" name="fecha_salida" required><br><br>

        <label for="hora_salida">Hora de Salida:</label>
        <input type="time" id="hora_salida" name="hora_salida" required><br><br>

        <label for="monto">Monto Total:</label>
        <input type="number" id="monto" name="monto" step="0.01" required><br><br>

        <button type="submit">Registrar</button>
    </form>
</body>
</html>
