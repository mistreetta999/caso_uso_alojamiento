<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Cabaña</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white text-center">
                        <h3 class="mb-0">Registrar Nueva Cabaña</h3>
                    </div>
                    <div class="card-body p-4">
                        
                        <form method="POST" enctype="multipart/form-data">
                            {% csrf_data %} <!-- Seguridad contra ataques externos -->
                            
                            <!-- Campos de texto y número -->
                            <div class="mb-3">
                                <label class="form-label fw-bold">Nombre de la cabaña</label>
                                {{ form.nombre }}
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Descripción</label>
                                {{ form.descripcion }}
                            </div>

                            <div class="row mb-3">
                                <div class="col">
                                    <label class="form-label fw-bold">Capacidad</label>
                                    {{ form.capacidad_personas }}
                                </div>
                                <div class="col">
                                    <label class="form-label fw-bold">Precio por noche</label>
                                    {{ form.precio_por_noche }}
                                </div>
                            </div>

                            <!-- Checkboxes de Bootstrap -->
                            <div class="mb-3 form-check">
                                {{ form.tiene_piscina }}
                                <label class="form-check-label ms-2">Tiene piscina</label>
                            </div>

                            <div class="mb-3 form-check">
                                {{ form.acepta_mascotas }}
                                <label class="form-check-label ms-2">Acepta mascotas</label>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold">Foto de la cabaña</label>
                                {{ form.imagen }}
                            </div>

                            <!-- Botón de envío -->
                            <div class="d-grid">
                                <button type="submit" class="btn btn-success btn-lg">Guardar Cabaña</button>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://jsdelivr.net"></script>
</body>
</html>
